same day) found this was specific to the brew install: after switching to the
official standalone installer (`curl -fsSL https://chatgpt.com/codex/install.sh |
sh`) to fix a separate shell-exec gap, re-testing the identical delegation probe —
plus a harder verbatim-quote canary probe — showed this file's real content DOES
