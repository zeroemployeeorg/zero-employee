[project]
name = "zero-employee"
version = "0.1.1"
description = "Open-source tools and infrastructure for building Zero Employee Organizations powered by AI agents."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Zero Employee Organizations", email = "zeroemployeeorg@dreamhuggers.com" },
]
maintainers = [
    { name = "Zero Employee Organizations Maintainers", email = "zeroemployeeorg@dreamhuggers.com" },
]
license = { text = "MIT" }
keywords = [
    "ai",
    "agents",
    "zero-employee",
    "governance",
    "sow-lint",
    "automation",
    "llm-orchestration",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0.1",
    "tiktoken>=0.7.0",
]

[project.urls]
Homepage = "https://zeroemployee.org"
Documentation = "https://zeroemployee.org/docs"
Repository = "https://github.com/zeroemployeeorg/zero-employee"
Issues = "https://github.com/zeroemployeeorg/zero-employee/issues"
Changelog = "https://github.com/zeroemployeeorg/zero-employee/releases"

[project.scripts]
zeo = "zero_employee.cli:main"
# sow-lint is RETAINED, never deprecated. 227 IMMUTABLE references name it - 64 in landed
# rulings, 163 in filed SOWs - and their check: fields must stay RUNNABLE (RULING-004,
# s5 append-dont-revert). Dropping it would make the corpus own verification claims
# unrunnable in one commit. RULING-093 legacy_name reasoning, applied to a command.
sow-lint = "zero_employee.cli:main"

# ── Build System Configuration ───────────────────────────────────────────
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zero_employee"]

[tool.hatch.build.targets.wheel.force-include]
"src/zero_employee/data/model_rates.toml" = "zero_employee/data/model_rates.toml"
"src/zero_employee/grandfather_manifest.toml" = "zero_employee/grandfather_manifest.toml"
"src/zero_employee/hooks_templates/pre-commit" = "zero_employee/hooks_templates/pre-commit"
"src/zero_employee/hooks_templates/cc-session-start.sh" = "zero_employee/hooks_templates/cc-session-start.sh"
"src/zero_employee/hooks_templates/cc-stop.sh" = "zero_employee/hooks_templates/cc-stop.sh"
"src/zero_employee/hooks_templates/cc-pretooluse-git.sh" = "zero_employee/hooks_templates/cc-pretooluse-git.sh"
"src/zero_employee/hooks_templates/install.sh" = "zero_employee/hooks_templates/install.sh"
"src/zero_employee/scaffold_templates/claude-md/CLAUDE.md" = "zero_employee/scaffold_templates/claude-md/CLAUDE.md"
"src/zero_employee/scaffold_templates/CLAUDE.md" = "zero_employee/scaffold_templates/CLAUDE.md"
"src/zero_employee/scaffold_templates/project-CLAUDE.md" = "zero_employee/scaffold_templates/project-CLAUDE.md"
"src/zero_employee/scaffold_templates/000-governance.mdc" = "zero_employee/scaffold_templates/000-governance.mdc"
"src/zero_employee/scaffold_templates/claude-settings.json" = "zero_employee/scaffold_templates/claude-settings.json"
"src/zero_employee/scaffold_templates/agents/zeo-architect.md" = "zero_employee/scaffold_templates/agents/zeo-architect.md"
"src/zero_employee/scaffold_templates/agents/zeo-claimant.md" = "zero_employee/scaffold_templates/agents/zeo-claimant.md"
"src/zero_employee/scaffold_templates/agents/zeo-verifier.md" = "zero_employee/scaffold_templates/agents/zeo-verifier.md"

# ── Dependencies & Development Groups ──────────────────────────────────
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

# ── Code Quality & Formatting (Ruff) ───────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
# Keep the historical gate surface (pycodestyle + pyflakes). Broader rule families
# are out of scope for this package's verify contract.
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "E741", "F841", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["zero_employee"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ── Testing Configuration (Pytest) ───────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

# ── Coverage Configuration ───────────────────────────────────────────
[tool.coverage.run]
branch = true
source = ["zero_employee"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
