[project]
name = "zero-employee"
version = "0.7.0"
description = "Open-source tools and infrastructure for building Zero Employee Organizations powered by AI agents."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Zero Employee Organizations", email = "zeroemployeeorg@dreamhuggers.com" },
]
maintainers = [
    { name = "Zero Employee Organizations Maintainers", email = "zeroemployeeorg@dreamhuggers.com" },
]
license = { text = "MIT" }
keywords = [
    "ai",
    "agents",
    "zero-employee",
    "governance",
    "sow-lint",
    "automation",
    "llm-orchestration",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0.1",
    "tiktoken>=0.7.0",
    "typer>=0.27.1",
]

[project.urls]
Homepage = "https://zeroemployee.org"
Documentation = "https://zeroemployee.org/docs"
Repository = "https://github.com/zeroemployeeorg/zero-employee"
Issues = "https://github.com/zeroemployeeorg/zero-employee/issues"
Changelog = "https://github.com/zeroemployeeorg/zero-employee/releases"

[project.scripts]
zeo = "zero_employee.cli:cli_entry"
# sow-lint is RETAINED, never deprecated. 227+ IMMUTABLE references name it across the
# fleet's landed rulings and filed SOWs, and their `check:` fields must stay RUNNABLE
# (RULING-004 s5, append-dont-revert) -- dropping this entry point makes those checks
# unrunnable in one commit. ZEO-RELEASE-CHARTER-01 s2.1 makes this explicit DoD: "the
# sow-lint alias ... is RETAINED, never deprecated ... sow-lint working after install
# is part of your DoD too." Restored by RULING-319/RULING-251 s3 remediation
# (zeo-release-SOW-4) after it was silently dropped at 09bbbf2 (2026-08-09) during the
# clean-cut rebrand -- a regression this charter's own DoD forbids. Points at the SAME
# entry function as zeo (cli_entry), not the pre-Typer `main`, so both names get the
# identical Typer-migrated CLI. RULING-093's legacy_name reasoning, applied to a command.
sow-lint = "zero_employee.cli:cli_entry"

# Sandcastle evidence adapter lives in zero_employee.adapters.sandcastle and has
# no extra runtime dependencies (JSON fixtures only). Do not add Node or the
# Sandcastle npm package to core.

# ── Build System Configuration ───────────────────────────────────────────
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.hatch.build.targets.wheel]
# REPO-EQUIP-SOW-1 s4 / SOW-4: `packages = ["src/zero_employee"]` with no
# `include`/`only-include` restriction makes hatchling's default project-file
# walk (hatchling/builders/plugin/interface.py: recurse_project_files, an
# os.walk under the package root) ship every file under src/zero_employee -
# not just *.py - with no per-file listing required. Verified by building the
# wheel with the previous hand-maintained `force-include` table removed
# entirely: model_rates.toml, grandfather_manifest.toml, every
# scaffold_templates/ and hooks_templates/ file (including a newly added one,
# claude-hooks/check-trunk-guard.sh, added by this same change) all shipped
# unlisted. The hand-list was never catching a real gap - it was redundant
# with default behavior the whole time, which is exactly how a new template
# file could still ship even though nobody remembered to add a line: the line
# was doing nothing. `force-include` is deliberately NOT reintroduced here for
# these files: an unnecessary explicit list is one more place to forget to
# update, and it was the mechanism this SOW measured as the actual risk.
# tests/test_packaging.py is the guarantee this stays true - it builds the
# wheel and fails if any file walked from scaffold_templates/ or
# hooks_templates/ on disk is absent from it, so a future `include`/
# `only-include` restriction that narrows the default walk is still caught.
packages = ["src/zero_employee"]

# ── Dependencies & Development Groups ──────────────────────────────────
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

# ── Code Quality & Formatting (Ruff) ───────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
# Keep the historical gate surface (pycodestyle + pyflakes). Broader rule families
# are out of scope for this package's verify contract.
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "E741", "F841", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["zero_employee"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ── Testing Configuration (Pytest) ───────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "adapter: optional harness adapter tests (fixtures only; no Node)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

# ── Coverage Configuration ───────────────────────────────────────────
[tool.coverage.run]
branch = true
source = ["zero_employee"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
